<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilia's Birthday Trivia</title>
<style>
  :root { --bg:#1b0f3a; --tile:#5b2bb5; --tile-hover:#7a45e0; --used:#2a1a55; --gold:#ffd166; --text:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  h1 { text-align:center; color:var(--gold); margin:8px 0 4px; font-size:clamp(1.6rem,5vw,3rem); letter-spacing:1px; }
  .sub { text-align:center; opacity:.8; margin:0 0 16px; }
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; max-width:1100px; margin:0 auto; }
  .cat { background:var(--tile); border-radius:6px; padding:12px 6px; text-align:center; font-weight:800;
         text-transform:uppercase; font-size:clamp(.6rem,1.8vw,1rem); display:flex; align-items:center; justify-content:center; min-height:64px; }
  .tile { background:var(--tile); border:0; border-radius:6px; color:var(--gold); font-weight:800;
          font-size:clamp(1rem,4vw,2.2rem); aspect-ratio:16/10; cursor:pointer; }
  .tile:hover { background:var(--tile-hover); }
  .tile.used { background:var(--used); color:transparent; cursor:default; }
  .bar { text-align:center; margin-top:16px; }
  .bar button { background:transparent; color:var(--text); border:1px solid #fff6; border-radius:6px; padding:8px 14px; cursor:pointer; }
  #modal { position:fixed; inset:0; background:var(--tile); display:none; flex-direction:column;
           align-items:center; justify-content:center; padding:24px; text-align:center; }
  #modal.open { display:flex; }
  #mcat { color:var(--gold); text-transform:uppercase; font-weight:700; letter-spacing:1px; }
  #clueImg { display:none; max-width:min(90vw,600px); max-height:45vh; background:#fff; border-radius:12px; padding:16px; margin-top:16px; }
  #clue { font-size:clamp(1.4rem,5vw,3rem); font-weight:700; max-width:900px; margin:20px 0; }
  #answer { font-size:clamp(1.1rem,3.5vw,2rem); color:var(--gold); min-height:1.5em; margin-bottom:24px; }
  .scores { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:1100px; margin:16px auto 0; }
  .player { background:var(--used); border-radius:8px; padding:10px; text-align:center; }
  .player .n { font-weight:700; }
  .player .s { color:var(--gold); font-size:clamp(1.3rem,4vw,2rem); font-weight:800; }
  .player button { background:transparent; color:#fff9; border:1px solid #fff4; border-radius:4px; font-size:.75rem; cursor:pointer; }
  .board > * { min-width:0; overflow-wrap:anywhere; }
  @media (max-width: 799px) { .scores { grid-template-columns:repeat(2,1fr); } }
  @media (min-width: 800px) {
    body { padding:12px 16px; }
    h1 { margin:0; }
    .sub { margin:0 0 10px; }
    .layout { display:flex; gap:14px; max-width:1400px; margin:0 auto; height:calc(100vh - 120px); }
    .board { flex:1; margin:0; max-width:none; grid-template-rows:auto repeat(5, 1fr); }
    .tile { aspect-ratio:auto; }
    .side { width:190px; display:flex; flex-direction:column; }
    .scores { grid-template-columns:1fr; margin:0; }
  }
  #award { display:none; margin-bottom:12px; }
  #award.show { display:block; }
  #modal #award button { background:#fff; }
  #modal button { font-size:1.1rem; padding:12px 24px; border-radius:8px; border:0; cursor:pointer; margin:4px;
                  background:var(--gold); color:#1b0f3a; font-weight:700; }
</style>
</head>
<body>
<h1>🎂 Lilia's Birthday Trivia 🎉</h1>
<p class="sub" id="roundLabel">Round 1 · Pick a category and a value</p>
<div class="layout">
  <div class="board" id="board"></div>
  <aside class="side">
    <div class="scores" id="scores"></div>
    <div class="bar"><button id="roundBtn" onclick="switchRound()">Go to Double Round →</button></div>
    <div class="bar"><button onclick="resetBoard()">Reset game</button></div>
  </aside>
</div>

<div id="modal">
  <div id="mcat"></div>
  <img id="clueImg" alt="">
  <div id="clue"></div>
  <div id="answer"></div>
  <div id="award"><div style="margin-bottom:8px">Who got it?</div><span id="awardBtns"></span></div>
  <div>
    <button id="revealBtn" onclick="reveal()">Show answer</button>
    <button onclick="closeClue()">Back to board</button>
  </div>
</div>

<script>
// ===== EDIT QUESTIONS HERE =====
// Each category has 5 clues, from 100 (easiest) up to 500 (hardest).
// Optional picture: add img: "img/file.png" (uploaded to lilia/img) or a full https:// link.
const CATEGORIES = [
  { name: "Liliaformation", clues: [
    { q: "In what grade did Lilia join Annie Wright", a: "6th" },
    { q: "The city where Lilia was born", a: "Seattle" },
    { q: "What two sports did Lilia play before volleyball", a: "Gymnastics and Softball" },
    { q: "Lilia's favorite shoe brand", a: "Adidas" },
    { q: "Name fivr countries Lilia has been to", a: "We will evaluate" },
  ]},
  { name: "Volleyball Terms", clues: [
    { q: "The player who usually makes the second touch to set up attackers", a: "What is the setter?" },
    { q: "A serve that lands untouched for a point", a: "What is an ace?" },
    { q: "Stopping an attack at the net with your hands up", a: "What is a block?" },
    { q: "The defensive specialist who wears a different-colored jersey", a: "What is the libero?" },
    { q: "The referee signals this fault by slowly raising one forearm, palm up, because the ball came to rest in a player's hands instead of being cleanly hit", a: "What is a lift (also called a catch or carry)?" },
  ]},
  { name: "Mishmash", clues: [
    { q: "What are the three branches of the U.S. government?", a: "Legislative, executive, and judicial" },
{ q: "Which pop superstar released the record-breaking Eras Tour and the album The Tortured Poets Department?", a: "Taylor Swift" },
{ q: "What is the name of the fictional Connecticut town where Lorelai and Rory Gilmore live in Gilmore Girls?", a: "Stars Hollow" },
{ q: "What mischievous, toothy-grinned monster plush became a must-have collectible craze, often clipped to bags?", a: "Labubu" },
{ q: "What social media app features short-form video content and a popular 'For You' page?", a: "TikTok" }

  ]},
  { name: "International Foods", clues: [
    { q: "Tacos originate from which country?", a: "Mexico" },
{ q: "Sushi originates from which country?", a: "Japan" },
{ q: "Pho (a fragrant noodle soup) is the national dish of which country?", a: "Vietnam" },
{ q: "Pad Thai (a popular fried rice-noodle dish) originates from which country?", a: "Thailand" },
{ q: "Naan (an oven-baked flatbread traditionally made in a tandoor) originates from which country?", a: "India" }
  ]},
  { name: "Logos", clues: [
    { q: "Name this brand", img: "img/pinterest.svg", a: "Pinterest" },
    { q: "Name this brand", img: "img/lulu.svg", a: "Lululemon" },
    { q: "Name this brand", img: "img/sephora.jpeg", a: "Sephora" },
    { q: "Name this brand", img: "img/stanley-symbol-the-bear-logo.png", a: "Stanley" },
    { q: "Name this brand", img: "img/dutch.svg", a: "Dutch Bros" },
  ]},
];
// ROUND 2: the Double Round. Same format, points are doubled (200 to 1000).
const ROUND2 = [
  { name: "Annie Wright History", clues: [
    { q: "What is the Annie Wright mascot?", a: "The Gators" },
    { q: "Annie Wright was the ___ of the school's co-founder, Charles Barstow Wright", a: "Daughter" },
    { q: "Before it was Annie Wright School, the school's original name was Annie Wright ___", a: "Seminary" },
    { q: "In what year did Annie Wright first open its doors?", a: "1884" },
    { q: "This Episcopal bishop co-founded the school with Charles Barstow Wright", a: "Bishop John A. Paddock" },
  ]},
  { name: "Finish That Lyric", clues: [
    { q: "Taylor Swift: \"'Cause the players gonna play, play, play, play, play, and the haters gonna...\"", a: "\"...hate, hate, hate, hate, hate\" (Shake It Off)" },
    { q: "Sabrina Carpenter: \"Say you can't sleep, baby, I know, that's that me...\"", a: "\"...espresso\" (Espresso)" },
    { q: "Olivia Rodrigo: \"And I know we weren't perfect, but I've never felt this way for...\"", a: "\"...no one\" (drivers license)" },
    { q: "HUNTR/X: \"We're goin' up, up, up, it's our moment... gonna be, gonna be...\"", a: "\"...golden\" (Golden)" },
    { q: "Chappell Roan: \"You'd have to stop the world just to stop the...\"", a: "\"...feeling\" (Good Luck, Babe!)" },
  ]},
  { name: "Logos 2", clues: [
    { q: "Name this brand", img: "img/starbucks.png", a: "Starbucks" },
    { q: "Name this brand", img: "img/crocs.png", a: "Crocs" },
    { q: "Name this brand", img: "img/owala.png", a: "Owala" },
    { q: "Name this brand", img: "img/glossier.png", a: "Glossier" },
    { q: "Name this brand", img: "img/soldejaneiro.png", a: "Sol de Janeiro" },
  ]},
  { name: "Round 2 Category 4", clues: [
    { q: "Placeholder clue", a: "TBD" }, { q: "Placeholder clue", a: "TBD" },
    { q: "Placeholder clue", a: "TBD" }, { q: "Placeholder clue", a: "TBD" },
    { q: "Placeholder clue", a: "TBD" },
  ]},
  { name: "Round 2 Category 5", clues: [
    { q: "Placeholder clue", a: "TBD" }, { q: "Placeholder clue", a: "TBD" },
    { q: "Placeholder clue", a: "TBD" }, { q: "Placeholder clue", a: "TBD" },
    { q: "Placeholder clue", a: "TBD" },
  ]},
];

const PLAYERS = ["Lilia", "Maeve", "Maisie", "Piper"];
// ===============================

const board = document.getElementById('board');
const ROUNDS = [CATEGORIES, ROUND2];
let round = 0, current = null, currentCol = 0, currentRow = 0, currentValue = 0;
let scores = PLAYERS.map(() => 0);
let used = [new Set(), new Set()];   // tiles already played, per round
const value = row => (row + 1) * 100 * (round + 1);

function drawScores() {
  document.getElementById('scores').innerHTML = PLAYERS.map((n, i) =>
    `<div class="player"><div class="n">${n}</div><div class="s">${scores[i]}</div>` +
    `<button onclick="adjust(${i},-100)" title="Fix a mistake">−100</button></div>`).join('');
}
function adjust(i, pts) { scores[i] += pts; drawScores(); }
function award(i) { if (i >= 0) adjust(i, currentValue); closeClue(); }

function build() {
  const cats = ROUNDS[round];
  board.innerHTML = '';
  cats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'cat'; d.textContent = c.name; board.appendChild(d);
  });
  for (let row = 0; row < 5; row++) {
    cats.forEach((c, col) => {
      const b = document.createElement('button');
      b.className = 'tile'; b.textContent = value(row);
      if (used[round].has(col + ',' + row)) b.classList.add('used');
      b.onclick = () => openClue(col, row, b);
      board.appendChild(b);
    });
  }
  document.getElementById('roundLabel').textContent =
    (round ? 'Double Round · Points are doubled!' : 'Round 1 · Pick a category and a value');
  document.getElementById('roundBtn').textContent = round ? '← Back to Round 1' : 'Go to Double Round →';
}
function switchRound() { round = 1 - round; build(); }
function openClue(col, row, btn) {
  if (btn.classList.contains('used')) return;
  current = btn; currentCol = col; currentRow = row; currentValue = value(row);
  document.getElementById('award').classList.remove('show');
  const c = ROUNDS[round][col];
  document.getElementById('mcat').textContent = c.name + ' · ' + currentValue;
  document.getElementById('clue').textContent = c.clues[row].q;
  const im = document.getElementById('clueImg');
  if (c.clues[row].img) { im.src = c.clues[row].img; im.style.display = 'block'; }
  else { im.removeAttribute('src'); im.style.display = 'none'; }
  document.getElementById('answer').textContent = '';
  document.getElementById('revealBtn').style.display = '';
  document.getElementById('modal').classList.add('open');
}
function reveal() {
  document.getElementById('answer').textContent = ROUNDS[round][currentCol].clues[currentRow].a;
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('awardBtns').innerHTML = PLAYERS.map((n, i) =>
    `<button onclick="award(${i})">${n} +${currentValue}</button>`).join('') +
    `<button onclick="award(-1)">Nobody</button>`;
  document.getElementById('award').classList.add('show');
}
function closeClue() {
  if (current) { current.classList.add('used'); used[round].add(currentCol + ',' + currentRow); }
  current = null;
  document.getElementById('modal').classList.remove('open');
  if (board.querySelector('.tile:not(.used)')) return;
  if (round === 0 && used[1].size < 25) {
    setTimeout(() => { alert('Round 1 complete! Time for the Double Round, where every clue is worth twice as much. 🔥'); round = 1; build(); }, 100);
  } else {
    const top = Math.max(...scores);
    const winners = PLAYERS.filter((_, i) => scores[i] === top);
    setTimeout(() => alert('🏆 ' + winners.join(' & ') + ' win' + (winners.length > 1 ? '' : 's') + ' with ' + top + ' points! 🎉'), 100);
  }
}
function resetBoard() {
  if (!confirm('Reset both rounds and all scores?')) return;
  scores = PLAYERS.map(() => 0); used = [new Set(), new Set()]; round = 0; build(); drawScores();
}
build(); drawScores();
</script>
</body>
</html>
